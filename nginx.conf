server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router 경로(/characters/1 등)로 직접 접속하거나 새로고침해도 index.html 반환
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 파일명에 해시가 붙은 빌드 결과물은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
