server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 텍스트 자원 압축 (JS 386KB → 약 113KB)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # React Router 경로(/characters/1 등)로 직접 접속하거나 새로고침해도 index.html 반환
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 파일명에 해시가 붙은 빌드 결과물은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않음 (배포해도 옛 번들이 잡히는 문제 방지)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
